<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HỌC ĐỂ LÀM GÌ</title><link rel="stylesheet" href="index.css"></head>
<body><main class="home" aria-label="Trang chủ Học để làm gì">
<div class="artwork" aria-hidden="true"></div>
<!-- Artwork sạch không chứa các bảng thông tin này, nên hiển thị mỗi thành phần đúng một lần tại đây. -->
<header class="player-card"><div class="avatar">👨🏻‍🎓</div><div class="player-info"><strong>Tên người chơi</strong><div class="xp-line"><b>Lv.1</b><span class="xp-bar"><i></i></span><small>0/100</small></div></div></header>
<nav class="top-actions"><button class="top-button class-button" id="classButton"><span>👥</span><span>Lớp<br><b>12A3</b></span><em>›</em></button><button class="top-button ranking-button" id="rankingButton"><span>🏆</span><span>Bảng xếp hạng</span><em>›</em></button></nav>
<aside class="ranking-panel"><h3>🏆 Bảng xếp hạng</h3><div class="rank-row current"><span>👑</span><b>Tên người chơi</b><strong>1250</strong></div><div class="rank-row"><span>2</span><b>Bạn A</b><strong>1120</strong></div><div class="rank-row"><span>3</span><b>Bạn B</b><strong>980</strong></div><div class="rank-row"><span>4</span><b>Bạn C</b><strong>870</strong></div><div class="rank-row"><span>5</span><b>Bạn D</b><strong>760</strong></div></aside>
<div class="ai-hint"><span>✦</span><i>Tri thức là chìa khóa<br>mở ra tương lai</i><b>🤖</b></div>
<div class="hotspots" aria-label="Điều hướng">
<button class="hit math" data-page="math.html" aria-label="Toán học"></button><button class="hit physics" data-page="physics.html" aria-label="Vật lý"></button><button class="hit chemistry" data-page="chemistry.html" aria-label="Hóa học"></button><button class="hit literature" data-page="literature.html" aria-label="Ngữ văn"></button><button class="hit sport" data-page="sport.html" aria-label="Thể dục"></button><button class="hit art" data-page="art.html" aria-label="Mỹ thuật"></button><button class="hit biology" data-page="biology.html" aria-label="Sinh học"></button><button class="hit geography" data-page="geography.html" aria-label="Địa lý"></button><button class="hit computer" data-page="computer.html" aria-label="Tin học"></button><button class="hit english" data-page="english.html" aria-label="Tiếng Anh"></button><button class="hit history" data-page="history.html" aria-label="Lịch sử"></button><button class="hit center" id="centerHit" aria-label="Giới thiệu Học để làm gì"></button>
<!-- Chỉ là vùng bấm trên icon đã có trong ảnh; không tạo icon thứ hai. --><button class="hit settings" data-popup="Cài đặt" aria-label="Cài đặt"></button><button class="hit rewards" data-popup="Phần thưởng" aria-label="Phần thưởng"></button><button class="hit missions" data-popup="Nhiệm vụ" aria-label="Nhiệm vụ"></button><button class="hit exit" data-popup="Thoát" aria-label="Thoát"></button></div>
<div class="dialog" id="dialog" aria-hidden="true"><section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button class="close" id="closeDialog" aria-label="Đóng">×</button><div class="dialog-icon">✨</div><h2 id="dialogTitle"></h2><p id="dialogText"></p><button class="confirm" id="confirmDialog">Đã hiểu</button></section></div>
</main><script src="index.js"></script></body></html>
